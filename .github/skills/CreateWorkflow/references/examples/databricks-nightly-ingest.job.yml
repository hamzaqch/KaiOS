resources:
  jobs:
    nightly_ingest:
      name: Nightly ingest
      tasks:
        - task_key: land_raw
          notebook_task:
            notebook_path: ../notebooks/land_raw.py
        - task_key: build_silver
          notebook_task:
            notebook_path: ../notebooks/build_silver.py
          depends_on:
            - task_key: land_raw
        - task_key: publish_gold
          python_wheel_task:
            package_name: analytics_jobs
            entry_point: publish_gold
          depends_on:
            - task_key: build_silver
      schedule:
        quartz_cron_expression: "0 30 2 * * ?"
        timezone_id: UTC
      email_notifications:
        on_failure:
          - data-platform-oncall@example.com
      max_concurrent_runs: 1
